---
layout: default
title: home
---
<ul class="drops">
    {% for post in site.posts %}
    <li>
        <span class="date">{{ post.date | date: "%Y-%m-%d" }}</span>
        <a class="title" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
        {% if post.excerpt %}
        <div class="desc">{{ post.excerpt | strip_html | strip }}</div>
        {% endif %}
        <div class="tags">
            {% for tag in post.tags %}
            <a class="tag" href="/tags/{{ tag | slugify }}/">{{ tag }}</a>
            {% endfor %}
        </div>
    </li>
    {% endfor %}
</ul>
